name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: nexcell-ci-${{ github.run_id }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate temporary CI configuration
        shell: bash
        run: |
          ci_db_password="$(openssl rand -hex 24)"
          echo "::add-mask::${ci_db_password}"

          {
            echo "POSTGRES_DB=app"
            echo "POSTGRES_USER=app"
            echo "POSTGRES_PASSWORD=${ci_db_password}"
            echo "DATABASE_URL=postgresql://app:${ci_db_password}@postgres:5432/app"
            echo "REDIS_URL=redis://redis:6379/0"
            echo "API_PORT=8000"
          } >> "${GITHUB_ENV}"

      - name: Build production image
        run: docker build --tag "nexcell-app:${IMAGE_TAG}" .

      - name: Start Compose stack
        run: docker compose up --detach --no-build

      - name: Wait for API liveness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 \
              http://localhost:8000/health >/dev/null; then
              echo "API became live on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done

          echo "API did not become live within 60 seconds" >&2
          exit 1

      - name: Run smoke tests
        run: ./smoke_test.sh

      - name: Print Compose status and logs on failure
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color || true

      - name: Shut down Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  deploy-ecs:
    name: Deploy to ECS
    needs: build-and-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}

    steps:
      - name: Check deployment configuration
        id: deployment_config
        shell: bash
        run: |
          missing=()
          for variable in AWS_ROLE_ARN AWS_REGION ECS_CLUSTER ECS_SERVICE; do
            if [[ -z "${!variable}" ]]; then
              missing+=("${variable}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "ECS deployment skipped; missing repository variables: ${missing[*]}"
          else
            echo "available=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.deployment_config.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy existing task definition to ECS
        if: steps.deployment_config.outputs.available == 'true'
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"

      - name: Confirm safe deployment skip
        if: steps.deployment_config.outputs.available != 'true'
        run: echo "AWS configuration is unavailable; CI completed without deploying."
